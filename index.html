<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大型電子寵物互動樂園 · Virtual Dog Pet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fef5e7 0%, #fde2e4 25%, #e8eaf6 60%, #e0f2fe 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 40px;
            color: #333;
        }

        /* 頂部導航列 */
        .top-nav {
            width: 100%;
            max-width: 920px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
        }

        .home-btn {
            background: linear-gradient(135deg, #06b6d4, #0284c7);
            color: #ffffff;
            border: none;
            padding: 9px 22px;
            border-radius: 9999px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .home-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.45);
            filter: brightness(1.05);
        }

        .breed-badge {
            background: #ffffff;
            color: #7c3aed;
            border: 1.5px solid #e9d5ff;
            padding: 7px 18px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.08);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .breed-badge .arrow {
            font-size: 11px;
            color: #9333ea;
            margin-left: 2px;
        }

        /* 標題區塊 */
        .header-title-box {
            text-align: center;
            margin-bottom: 24px;
        }

        .main-title {
            font-size: 28px;
            font-weight: 800;
            color: #6b21a8;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .sub-title {
            font-size: 14px;
            color: #6b7280;
            font-weight: 500;
        }

        /* 雙欄主遊戲容器 (精緻適中比例，不用過寬) */
        .game-main-container {
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 390px 1fr;
            gap: 20px;
            align-items: stretch;
        }

        @media (max-width: 860px) {
            .game-main-container {
                grid-template-columns: 1fr;
                max-width: 440px;
            }
        }

        /* 左右兩張白色主卡片 */
        .game-card {
            background: #ffffff;
            border: 2.5px solid #8b5cf6;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 12px 36px rgba(139, 92, 246, 0.12);
            display: flex;
            flex-direction: column;
        }

        /* 左卡：氣泡對話框與影片 */
        .left-card {
            gap: 14px;
        }

        .speech-bubble-container {
            position: relative;
        }

        .pet-speech-bubble {
            background: #ffffff;
            border: 1.5px solid #d8b4e2;
            border-radius: 16px;
            padding: 10px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #581c87;
            position: relative;
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.06);
            transition: all 0.3s ease;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 對話氣泡的小箭頭 (向上指著上方的影片) */
        .pet-speech-bubble::after {
            content: '';
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 9px;
            border-style: solid;
            border-color: transparent transparent #ffffff transparent;
            display: block;
            width: 0;
            z-index: 2;
        }

        .pet-speech-bubble::before {
            content: '';
            position: absolute;
            top: -11px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 9px 10px;
            border-style: solid;
            border-color: transparent transparent #d8b4e2 transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        /* 影片播放框 (鎖定原生 464x688 垂直直式比例，cover 填滿無黑邊) */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 464 / 688;
            background: linear-gradient(180deg, #2b1747 0%, #1e1133 100%);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        #pet-video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            border-radius: 18px;
            background: transparent;
        }

        /* 右卡：狀態儀表板與按鈕 */
        .right-card {
            gap: 16px;
            justify-content: space-between;
        }

        /* 狀態儀表板 */
        .dashboard-box {
            background: #faf5ff;
            border: 1.5px dashed #c084fc;
            border-radius: 18px;
            padding: 16px 18px;
        }

        .dashboard-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #6b21a8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 18px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: #4b5563;
        }

        .stat-header .num {
            font-weight: 700;
            color: #6b21a8;
        }

        /* 客製化彩色進度條 */
        .custom-bar-track {
            width: 100%;
            height: 10px;
            background: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .custom-bar-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.4s ease-in-out;
        }

        .bar-health { background: linear-gradient(90deg, #f87171, #ef4444); }
        .bar-food   { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .bar-water  { background: linear-gradient(90deg, #60a5fa, #3b82f6); }
        .bar-clean  { background: linear-gradient(90deg, #34d399, #10b981); }
        .bar-love   { background: linear-gradient(90deg, #f472b6, #ec4899); }

        /* 心情列 */
        .mood-pill-box {
            background: #ffffff;
            border: 1.5px solid #fbcfe8;
            border-radius: 9999px;
            padding: 7px 16px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #db2777;
            box-shadow: 0 2px 8px rgba(244, 114, 182, 0.12);
        }

        #mood-text {
            color: #e11d48;
            letter-spacing: 0.5px;
        }

        /* 互動提示標題 */
        .interaction-title {
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            color: #581c87;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 4px 0 2px;
        }

        /* 3x3 互動按鈕網格 */
        .interaction-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .action-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 12px 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(109, 40, 217, 0.28);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .action-btn:hover {
            transform: translateY(-2.5px);
            box-shadow: 0 7px 18px rgba(109, 40, 217, 0.42);
            filter: brightness(1.08);
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn.is-active {
            box-shadow: 0 0 0 3px #fef08a, 0 8px 24px rgba(124, 58, 237, 0.5) !important;
            transform: scale(1.02);
            filter: brightness(1.15);
            animation: pulseGlow 1.2s infinite;
        }

        .action-btn:disabled,
        .action-btn.is-disabled {
            opacity: 0.55;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(0.2);
            transform: none !important;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .btn-sub {
            display: block;
            font-size: 11px;
            color: #e9d5ff;
            font-weight: 500;
            margin-top: 3px;
            text-transform: lowercase;
            letter-spacing: 0.3px;
        }

        /* 音效切換按鈕 */
        .sound-toggle-area {
            text-align: center;
            margin-top: 8px;
        }

        .pet-sound-toggle-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 9px 24px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .pet-sound-toggle-btn:hover {
            transform: translateY(-1.5px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.42);
            filter: brightness(1.06);
        }

        .pet-sound-toggle-btn.muted {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* 裝飾波紋 / 動畫 */
        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .action-btn:focus {
            outline: none;
        }
    </style>
</head>
<body>

    <!-- 頂部導航條 -->
    <header class="top-nav">
        <div class="breed-badge" title="品種切換">

    </header>

    <!-- 頂部大標題 -->

    <!-- 雙欄主卡片區 -->
    <main class="game-main-container">

        <!-- 左卡：影片播放器 + 下方對話氣泡 -->

            </div>

            <div class="speech-bubble-container">

                    🐾 汪汪！我是你的專屬邊境牧羊犬，點擊右方按鈕和我互動喔！
                </div>
            </div>
        </section>

        <!-- 右卡：健康儀表板 + 3x3互動按鈕 + 音效開關 -->
        <section class="game-card right-card">

            <!-- 狗狗健康狀態儀表板 -->
            <div class="dashboard-box">
                <div class="dashboard-title">
                    📊 狗狗健康狀態儀表板
                </div>

                <div class="status-grid">
                    <!-- 健康 -->
                    <div class="stat-item">
                        <div class="stat-header">

                        <div class="custom-bar-track">

                    <!-- 飽足感 -->
                    <div class="stat-item">
                        <div class="stat-header">
                            <span>🍖 飽足感 (Hunger):</span>

                        </div>
                        <div class="custom-bar-track">
                            <div id="food-bar" class="custom-bar-fill bar-food" style="width: 80%;"></div>
                        </div>
                    </div>

                    <!-- 水分 -->
                    <div class="stat-item">
                        <div class="stat-header">
                            <span>💧 水分 (Water):</span>
                            <span class="num"><span id="water-value">80</span>/100</span>
                        </div>
                        <div class="custom-bar-track">
                            <div id="water-bar" class="custom-bar-fill bar-water" style="width: 80%;"></div>
                        </div>
                    </div>

                    <!-- 衛生 -->
                    <div class="stat-item">
                        <div class="stat-header">
                            <span>🧼 衛生 (Cleanliness):</span>
                            <span class="num"><span id="clean-value">100</span>/100</span>
                        </div>
                        <div class="custom-bar-track">
                            <div id="clean-bar" class="custom-bar-fill bar-clean" style="width: 100%;"></div>
                        </div>
                    </div>

                    <!-- 親密度 -->
                    <div class="stat-item" style="grid-column: span 2;">
                        <div class="stat-header">
                            <span>💕 親密度 (Attachment):</span>
                            <span class="num"><span id="love-value">50</span>/100</span>
                        </div>
                        <div class="custom-bar-track">
                            <div id="love-bar" class="custom-bar-fill bar-love" style="width: 50%;"></div>
                        </div>
                    </div>
                </div>

                <!-- 心情狀態 -->
                <div class="mood-pill-box">
                    <span>✨ 心情 (Mood) :</span>
                    <span id="mood-text">❤️❤️❤️❤️❤️❤️ 超開心</span>
                </div>
            </div>

            <!-- 互動按鈕區 -->
            <div>
                <div class="interaction-title">
                    🎮 點擊下方按鈕與狗狗互動
                </div>
                <div class="interaction-grid" id="interaction-panel">
                    <!-- 9 顆紫色按鈕將由 JavaScript 動態生成 -->
                </div>
            </div>

            <!-- 音效開關切換按鈕 -->
            <div class="sound-toggle-area">
                <button id="pet-sound-toggle-btn" class="pet-sound-toggle-btn" type="button" onclick="togglePetSound()" title="點擊切換音效開關 · Click to Mute / Unmute">
                    <span id="pet-sound-icon">🔊</span>
                    <span id="pet-sound-text">音效開啟 · Sound ON</span>
                </button>
            </div>

        </section>

    </main>

            'withcollar.mp4':   '💎 佩戴上專屬造型項圈，帥氣亮眼，超級神氣！'

        // 隨機取一支影片 (依你主頁原始邏輯)
        function getRandomVideo(action) {
            const list = videos[action] || videos.default;
            return list[Math.floor(Math.random() * list.length)];
        }

        // 音效控制
        let isPetMuted = false;
        function updatePetSoundUI() {
            const btn = document.getElementById('pet-sound-toggle-btn');
            const icon = document.getElementById('pet-sound-icon');
            const text = document.getElementById('pet-sound-text');
            if (!btn) return;
            if (isPetMuted) {
                btn.classList.add('muted');
                if (icon) icon.textContent = '🔇';
                if (text) text.textContent = '已靜音 · Sound OFF';
            } else {
                btn.classList.remove('muted');
                if (icon) icon.textContent = '🔊';
                if (text) text.textContent = '音效開啟 · Sound ON';
            }
        }
        window.togglePetSound = function() {
            isPetMuted = !isPetMuted;
            if (video) {
                video.muted = isPetMuted;
                video.volume = isPetMuted ? 0 : 1.0;
            }
            updatePetSoundUI();
        };

        // 更新畫面上的進度條與心情 (完全相容進度條樣式)
        function updateStatus() {
            const setBar = (fillId, val, textId) => {
                const fillEl = document.getElementById(fillId);
                const txt = document.getElementById(textId);
                if (fillEl) {
                    if (fillEl.tagName === 'PROGRESS') {
                        fillEl.value = val;
                    } else {
                        fillEl.style.width = Math.max(0, Math.min(100, val)) + '%';
                    }
                }
                if (txt) txt.textContent = Math.round(val);
            };

            setBar('health-bar', pet.health, 'health-value');
            setBar('food-bar', pet.food, 'food-value');
            setBar('water-bar', pet.water, 'water-value');
            setBar('clean-bar', pet.clean, 'clean-value');
            setBar('love-bar', pet.love, 'love-value');

            const avg = (pet.health + pet.food + pet.water + pet.clean + pet.love) / 5;
            if (mood) {
                if (avg >= 80) mood.textContent = '❤️❤️❤️❤️❤️❤️ 超開心';
                else if (avg >= 60) mood.textContent = '❤️❤️❤️❤️ 開心';
                else if (avg >= 40) mood.textContent = '❤️❤️❤️ 普通';
                else if (avg >= 20) mood.textContent = '⚡⚡ 不太開心';
                else mood.textContent = '⚡⚡⚡⚡⚡ 哭哭';
            }
        }

        // 主要動作函式 (直接依你主頁原始的直接播放邏輯，按鈕永遠不鎖死！)
        function doAction(action) {
            // 改變數值
            if (action === 'feed')       pet.food = Math.min(100, pet.food + 25);
            if (action === 'water')      pet.water = Math.min(100, pet.water + 25);
            if (action === 'pet')        pet.love = Math.min(100, pet.love + 15);
            if (action === 'bath')       pet.clean = 100;
            if (action === 'clean_poo')  pet.clean = Math.min(100, pet.clean + 40);
            if (action === 'heal')       { pet.health = 100; pet.isSick = false; }
            if (action === 'out')        { pet.love = Math.min(100, pet.love + 20); pet.food = Math.max(0, pet.food - 10); }
            if (action === 'watch')      pet.love = Math.min(100, pet.love + 10);
            if (action === 'dress')      pet.accessory = (pet.accessory === 'none' ? 'hat' : 'none');

            // 播放對應影片 (秒速讀取快取)
            const nextSrc = getRandomVideo(action);
            if (video) {
                video.loop = false;
                video.src = getVideoUrl(nextSrc);
                video.muted = isPetMuted;
                video.volume = isPetMuted ? 0 : 1.0;
                video.play().catch(e => console.log('play note:', e));
            }

            // 更新台詞
            if (thoughtBubble && videoSpecificMessages[nextSrc]) {
                thoughtBubble.innerText = videoSpecificMessages[nextSrc];
            }

            // 更新狀態列
            updateStatus();
        }

        // 動態生成 9 顆按鈕 (依你主頁邏輯生成)
        function createButtons() {
            const panel = document.getElementById('interaction-panel');
            if (!panel) return;
            panel.innerHTML = '';

            const actions = ['feed', 'water', 'pet', 'bath', 'clean_poo', 'heal', 'out', 'watch', 'dress'];

            actions.forEach(action => {
                const btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.innerHTML = buttonLabels[action];
                btn.onclick = () => doAction(action);
                panel.appendChild(btn);
            });
        }

        // 自然狀態隨時間緩慢消耗
        setInterval(() => {
            pet.food = Math.max(0, pet.food - 1);
            pet.water = Math.max(0, pet.water - 1);
            if (pet.food < 30 || pet.water < 30) {
                pet.health = Math.max(0, pet.health - 1);
            }
            updateStatus();
        }, 15000);

        // 頁面載入完成後執行
        function initPet() {
            createButtons();
            updateStatus();
            updatePetSoundUI();

            if (video) {
                video.src = getVideoUrl(getRandomVideo('default'));
                video.muted = true;
                video.volume = 0;
                video.play().catch(e => console.log('init play note:', e));

                // 影片結束後自動播放待機動畫 (依你主頁原始的 ended 監聽)
                video.addEventListener('ended', () => {
                    video.src = getVideoUrl(getRandomVideo('default'));
                    video.muted = true;
                    video.volume = 0;
                    video.play().catch(e => console.log('default play note:', e));
                    if (thoughtBubble) {
                        thoughtBubble.innerText = '🐾 狗狗在休息中～隨時點擊右側按鈕和我互動喔！';
                    }
                });

                // 影片防卡保護：當音軌長度微差導致漏發 ended 時，自動觸發 ended
                video.addEventListener('timeupdate', () => {
                    if (video.duration > 0 && video.currentTime >= video.duration - 0.1) {
                        if (video.paused) {
                            video.dispatchEvent(new Event('ended'));
                        }
                    }
                });
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPet);
        } else {
            initPet();
        }
    </script>
